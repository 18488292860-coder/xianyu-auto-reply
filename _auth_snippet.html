<!-- client-side auth (not secure) -->
<style>
  #authMask { position:fixed; inset:0; background:#fff; z-index:9999; display:flex; align-items:center; justify-content:center }
  #authBox { width:320px; padding:20px; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,0.06); background:#fff; text-align:center; font-family:inherit}
  #authBox input{width:100%;padding:8px;margin:8px 0;border:1px solid #ddd;border-radius:6px}
  #authBox button{padding:8px 12px;border-radius:6px;background:#667eea;color:#fff;border:none;cursor:pointer}
</style>
<div id="authMask" aria-hidden="false">
  <div id="authBox">
    <div style="font-weight:600;margin-bottom:8px">管理后台登录</div>
    <input id="authUser" placeholder="用户名" value="" />
    <input id="authPass" placeholder="密码" type="password" />
    <div style="text-align:right;margin-top:8px">
      <button id="authBtn">登录</button>
    </div>
    <div style="font-size:12px;color:#999;margin-top:8px">提示：此保护仅为基本前端校验，不能替代服务器端鉴权。</div>
  </div>
</div>
<script>
  (function(){
    var USER = 'admin168';
    var PASS = '223366';
    var mask = document.getElementById('authMask');
    var btn = document.getElementById('authBtn');
    function ok(){ mask.style.display='none'; mask.setAttribute('aria-hidden','true'); }
    btn.addEventListener('click', function(){
      var u = document.getElementById('authUser').value || '';
      var p = document.getElementById('authPass').value || '';
      if(u===USER && p===PASS){ ok(); }
      else { alert('用户名或密码错误'); }
    });
    document.getElementById('authPass').addEventListener('keydown', function(e){ if(e.key==='Enter') btn.click(); });
  })();
</script>
